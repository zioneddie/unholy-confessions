  <script>
    const BOT_TOKEN = "8715731116:AAGmr450A0nx_dKlWsLF090lmPVgjdsoQHU";
    const CHAT_ID = "5982017489";

    // Father Notes
    const notes = [
      "“Father is currently judging no one and eating chips.”",
      "“Today’s mood: tired but still listening.”",
      "“If you’re reading this at 3am… same.”",
      "“Whatever you did, someone here probably did worse.”",
      "“You can put the heavy ones here too.”",
      "“No one is as clean as they look.”",
      "“This stays between us.”"
    ];
    document.getElementById('fathersNote').textContent = notes[Math.floor(Math.random() * notes.length)];

    // Live Indicators
    function updateTypingCount() {
      const number = Math.floor(Math.random() * 13) + 4;
      document.getElementById('typingIndicator').textContent = `🟢 ${number} typing`;
    }

    function updateLastConfession() {
      const options = ["just now", "1m ago", "2m ago", "3m ago", "4m ago", "5m ago", "6m ago", "8m ago"];
      const random = options[Math.floor(Math.random() * options.length)];
      document.getElementById('lastConfession').textContent = `Last confession received ${random}`;
    }

    setInterval(updateTypingCount, Math.random() * 20000 + 18000);
    setInterval(updateLastConfession, Math.random() * 30000 + 25000);
    updateTypingCount();
    updateLastConfession();

    // Celebration
    function launchCelebration() {
      const colors = ['#D4AF37', '#F59E0B', '#FBBF24', '#FFFFFF', '#FCD34D'];
      const emojis = ['🕯️', '✨', '🌸', '🌼', '💫', '🌿'];

      for (let i = 0; i < 38; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        
        if (Math.random() > 0.55) {
          confetti.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
          confetti.style.fontSize = Math.random() * 12 + 14 + 'px';
        } else {
          confetti.style.width = Math.random() * 8 + 6 + 'px';
          confetti.style.height = confetti.style.width;
          confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.borderRadius = '50%';
        }

        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.animationDuration = Math.random() * 2 + 2.2 + 's';
        confetti.style.opacity = Math.random() * 0.7 + 0.3;

        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 4200);
      }
    }

    // Form logic
    const form = document.getElementById('confessionForm');
    const textarea = document.getElementById('confessionText');
    const charCount = document.getElementById('charCount');
    const submitBtn = document.getElementById('submitBtn');
    const successMessage = document.getElementById('successMessage');
    const securityLine = document.getElementById('securityLine');
    const selectedCategoryInput = document.getElementById('selectedCategory');

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => {
          b.classList.remove('border-amber-500/40', 'text-amber-300');
          b.classList.add('border-white/10', 'text-gray-400');
        });
        btn.classList.remove('border-white/10', 'text-gray-400');
        btn.classList.add('border-amber-500/40', 'text-amber-300');
        selectedCategoryInput.value = btn.dataset.value;
      });
    });

    textarea.addEventListener('input', () => {
      charCount.textContent = `${textarea.value.length} / 10000`;
    });

    // Reliable Telegram Sender
    async function sendTelegramMessage(text, category, severity) {
      const maxChunkSize = 3500;
      
      if (text.length <= maxChunkSize) {
        const payload = `🚨 <b>NEW UNHOLY CONFESSION</b>\n\n<b>Category:</b> ${category}\n<b>Severity:</b> ${severity}\n\n<b>Confession:</b>\n"${text}"`;
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: CHAT_ID, text: payload, parse_mode: 'HTML' })
        });
        if (!res.ok) throw new Error("Telegram API error");
      } else {
        const totalParts = Math.ceil(text.length / maxChunkSize);
        for (let i = 0; i < totalParts; i++) {
          const chunk = text.substring(i * maxChunkSize, (i + 1) * maxChunkSize);
          const header = i === 0 
            ? `🚨 <b>NEW UNHOLY CONFESSION (Part 1/${totalParts})</b>\n\n<b>Category:</b> ${category}\n<b>Severity:</b> ${severity}\n\n<b>Confession:</b>\n`
            : `🚨 <b>NEW UNHOLY CONFESSION (Part ${i + 1}/${totalParts})</b>\n\n`;
            
          const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: header + `"${chunk}"`, parse_mode: 'HTML' })
          });
          if (!res.ok) throw new Error("Telegram API error");
        }
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = textarea.value.trim();
      const category = selectedCategoryInput.value;
      const severityRadio = document.querySelector('input[name="severity"]:checked');
      const severity = severityRadio ? severityRadio.value : "Mild 😇";

      if (!text) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Sending...';

      try {
        await sendTelegramMessage(text, category, severity);

        // Success screen transition
        const title = document.getElementById('successTitle');
        const subtitle = document.getElementById('successSubtitle');
        const fatherMsg = document.getElementById('fatherMessage');

        if (severity.includes("Unpardonable")) {
          title.textContent = "This one is heavy.";
          subtitle.innerHTML = "Your secret has been received.<br>No one will ever know it was you.";
          fatherMsg.textContent = "Your confession will be posted on X.";
        } else {
          title.textContent = "Go in peace.";
          subtitle.innerHTML = "Your secret has been received.<br>No one will ever know it was you.";
          fatherMsg.textContent = "Your confession will be posted on X.";
        }

        form.classList.add('hidden');
        securityLine.classList.add('hidden');
        successMessage.classList.remove('hidden');
        launchCelebration();

        // Safe history push for back button
        try { history.pushState({ page: 'submitted' }, '', '#submitted'); } catch(e) {}

      } catch (err) {
        console.error(err);
        alert('Failed to send. Please check your network connection and try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Send to Father</span> 🕯️';
      }
    });

    function resetForm() {
      textarea.value = '';
      charCount.textContent = '0 / 10000';
      successMessage.classList.add('hidden');
      form.classList.remove('hidden');
      securityLine.classList.remove('hidden');
    }

    window.addEventListener('popstate', () => {
      if (!successMessage.classList.contains('hidden')) {
        resetForm();
      }
    });
  </script>
